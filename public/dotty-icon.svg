<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dotty-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#dotty-grad)" stroke-width="4" opacity="0.3" />
  <circle cx="50" cy="50" r="22" fill="url(#dotty-grad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="8" fill="#ffffff" />
  <circle cx="72" cy="28" r="5" fill="#38bdf8" filter="url(#glow)" />
</svg>
